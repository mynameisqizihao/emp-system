<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>员工管理系统登录页</title>
    <link rel="stylesheet" href="../static/css/login.css">
</head>
<body>
<!--白色卡片容器-->
<div class="login_img_container">
<!--    图片外壳-->
    <div class="login_head_img">
        <img src="../static/img/001.jpg" alt="图片加载失败！">
    </div>

    <p class="login_title">齐子豪的员工管理系统（登录页）</p>
</div>


<!--    输入用户名和密码的文本框-->
<form action="" method="post" class="login_form">
<!--用户名-->
    <div class="login_form_input_username">
        <label for="username">用户名：</label>
        <input type="text" id="username" name="username" placeholder="请输入用户名">
    </div>

    <!--    没有账号快速去注册界面-->
    <div class="register_tips">
        <span>没有账号？去</span>
        <a href="register.html" class="register_tips_a">注册</a>
    </div>

<!--密码-->
    <div class="login_form_input_password">
        <label for="password">密码：</label>
        <input type="password" id="password" name="password" placeholder="请输入密码">
    </div>

    <a href="index.html" class="login_btn">登 录</a>

</form>
<!--国际化-->
<div class="login_language">
    <a href="#" class="login_language_Chinese">中文</a>
    <span class="login_language_separator"> | </span>
    <a href="#" class="login_language_English">English</a>
</div>

</body>
</html>
